name: Publish ABOPC HTML CSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check authored HTML and CSS
        run: node tools/check.mjs
      - name: Check CSS cache invalidation
        run: node --test tools/version-css.test.mjs
      - name: Copy website files without a build
        env:
          PAGE_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          node tools/package.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
